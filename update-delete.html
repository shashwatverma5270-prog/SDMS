<div class="main">

<h1>Update / Delete Student</h1>

<form id="updateForm">

<input type="text" id="roll" placeholder="Roll Number" required>

<input type="text" id="name" placeholder="Student Name" required>

<input type="text" id="course" placeholder="Course">

<input type="text" id="department" placeholder="Department">

<input type="text" id="phone" placeholder="Phone Number">

<input type="email" id="email" placeholder="Email">

<div class="buttons">

<button type="button" onclick="updateStudent()">Update</button>

<button type="button" class="delete" onclick="deleteStudent()">Delete</button>

<button type="reset">Clear</button>

</div>

</form>
